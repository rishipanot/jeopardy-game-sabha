<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeopardy - Savage Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#fff;text-align:center;
}

h1{
margin:20px;font-size:32px;
background:linear-gradient(90deg,#00f5ff,#ff00d4);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.board{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;width:95%;margin:auto;
}

.category{
background:rgba(255,255,255,0.05);
padding:12px;border-radius:10px;font-weight:600;
}

.cell{
background:linear-gradient(135deg,#0ea5e9,#6366f1);
padding:25px;border-radius:12px;
cursor:pointer;transition:0.3s;
}
.cell:hover{transform:scale(1.05);box-shadow:0 0 15px #00f5ff;}
.cell.used{background:#111;opacity:.4;}

#questionBox{
margin:30px auto;padding:25px;width:70%;
background:rgba(255,255,255,0.05);
border-radius:15px;display:none;
}

#reaction{
font-size:22px;margin-bottom:15px;color:#facc15;
}

.option{
margin:10px 0;padding:12px;border-radius:10px;
background:rgba(255,255,255,0.08);
cursor:pointer;transition:0.3s;
}
.option:hover{transform:translateX(5px);}

.correct{background:#22c55e!important;}
.wrong{background:#ef4444!important;}
</style>
</head>

<body>

<h1>🔥 Jeopardy - Savage Mode 🔥</h1>

<div class="board" id="board"></div>

<div id="questionBox">
<div id="reaction"></div>
<h2 id="question"></h2>
<div id="options"></div>
</div>

<script>

/* ================= DATA ================= */

const categories=[
"General Knowledge","Science & Tech","The Scroll",
"Sports","Spiritual","Geopolitics"
];

const questions=[
[
"While the Tiger is our National Animal, which animal holds the official title of India's 'National Heritage Animal'?",
"Which iconic monument was built specifically to welcome King George V and Queen Mary on their visit to India in 1911?",
"Which Indian city is famously known as the 'Silicon Valley of India'?",
"India hosted the G20 Leaders' Summit for the first time in which year?",
"Which Indian state shares its international borders with Nepal, Bhutan, and China?"
],
[
"What is the two-letter chemical symbol for Gold?",
"Which planet currently holds the record for the highest number of moons?",
"We use it on our smartphones every day, but what does the 'G' stand for in 5G network technology?",
"What is the name of India's first dedicated space mission launched by ISRO to study the Sun?",
"The incredibly powerful James Webb Space Telescope primarily observes the universe using which type of light?"
],
[
"What does the popular internet abbreviation POV stand for, especially seen on Reels and Shorts?",
"If someone says No Cap during a conversation or in a comment section, what are they trying to convey?",
"Which AI chatbot, developed by the company OpenAI, became a massive global sensation for its ability to answer questions and write code?",
"Originally a gaming term, what three-letter abbreviation is now used as slang to describe someone who just blindly follows trends without thinking for themselves?",
"What is the popular term for the harmful habit of obsessively scrolling through negative, sad, or alarming news on social media for long periods of time?"
],
[
"In the IPL, what is the official term for the rule introduced in 2023 that allows a team to replace a player in the playing XI during the middle of the match?",
"Which Formula 1 driver currently holds the all-time record for the most consecutive race wins in a single season?",
"Who is the first and only Indian woman to win two consecutive Olympic medals in an individual sport?",
"In April 2024, which Indian chess prodigy made history by becoming the youngest-ever winner of the FIDE Candidates Tournament at just 17 years old?",
"Which fast bowler holds the record for taking the fastest 50 wickets in IPL history, achieving the milestone in just 27 matches?"
],
[
"What was the childhood name of Bhagwan Swaminarayan before he began his Kalyan Yatra?",
"Which spiritual leader expressed his immense love for the youth and sincere bhakti towards his guru, Yogiji Maharaj, through the famous sutra: 'Yuvako maru hriday che, yuvako maru sarvasva che'?",
"Bhagwan Swaminarayan wrote which foundational scripture containing 212 shlokas that outlines the daily code of conduct for all devotees?",
"Guruhari P.P. Prabodh Swamiji has given a golden key for students. To score 95% in any exam ('Jo tamare koi pan pariksha ma 95% score karva hoi toh...''), living life according to which specific Vachanamrut is essential?",
"For a student like us who studies in school or college, which of Guruhari P.P. Prabodh Swamiji’s four sutras (Seva, Smruti, Suhradbhav, Swadharma) represents their most important primary duty?"
],
[
"India's nuclear doctrine?",
"Which country is part of QUAD?",
"Full form of BRICS?",
"India shares longest border with?",
"Which nation is NOT in NATO?"
]
];

const options=[
[
["Lion","Elephant","Rhinoceros","Leopard"],
["India Gate","Victoria Memorial","Gateway of India","Taj Mahal Palace"],
["Hyderabad","Pune","Chennai","Bengaluru"],
["2021","2022","2023","2024"],
["Arunachal Pradesh","Sikkim","Uttarakhand","West Bengal"]
],
[
["Go","Gd","Au","Ag"],
["Jupiter","Mars","Uranus","Saturn"],
["Gigabit","Generation","Global","Grid"],
["Surya-1","Bhaskar-Pro","Aditya-L1","Helios-A"],
["Ultraviolet","X-Ray","Infrared","Microwave"]
],
[
["Play On Video","Point Of View","Power Of Vision","Place Of Value"],
["Leaving","Forgot hat","Truth","Angry"],
["Gemini","Copilot","ChatGPT","Siri"],
["AFK","NPC","BRB","BOT"],
["Rage-baiting","Ghosting","Doomscrolling","Phishing"]
],
[
["Super Sub","X-Factor","Impact Player","Tactical Sub"],
["Hamilton","Verstappen","Schumacher","Vettel"],
["Mary Kom","Saina","Lovlina","PV Sindhu"],
["Praggnanandhaa","Nihal","Vidit","Gukesh D"],
["Malinga","Bumrah","Rabada","Rashid"]
],
[
["Nilkanth","Sahajanand","Ghanshyam","Sarjoo"],
["Guruhari prabodh swamiji ","Guruhari Hariprasad swamiji","Guru hari Shastriji maharaj","Guru hari Bhagatji maharaj"],
["Vachanamrut","Shikshapatri","Swamini Vato","Bhaktichintamani"],
["Vadtal 11","Gadhada Pratham 22","Gadhada Pratham 18","Loya 12"],
["Seva","Smruti","Suhradbhav","Swadharma"]
],
[
["No First Use","First Use","Flexible","None"],
["India","China","Russia","Germany"],
["Brazil Russia India China South Africa","Asia Group","Alliance","Union"],
["Bangladesh","China","Pakistan","Nepal"],
["India","USA","France","Germany"]
]
];

const correctAnswers=[
[1,2,3,2,1],
[2,3,1,2,2],
[1,2,2,1,2],
[2,1,3,3,2],
[2,1,1,2,3],
[0,0,0,0,0]
];

/* ===== SAVAGE BEFORE ANSWER ===== */
const reactions=[
["🙂 GK 100 - Aata hai bhai… yaad kar","😏 GK 200 - Bas zubaan pe hai","😈 GK 300 - Yaad aa raha hai… aa raha hai…","😵 GK 400 - Itna close… phir bhi nahi","☠️ GK 500 - Agar yeh yaad aa gaya toh legend 🔥"],
["🙂 Sports 100 - Easy lag raha hai?","😏 Sports 200 - Ab thoda deep jaana padega","😈 Sports 300 - Sirf fan nahi, expert ban","😵 Sports 400 - Yeh sabko nahi pata hota","☠️ Sports 500 - Analyst level question 🔥"],
["🙂 History 100 - NCERT flashback","😏 History 200 - Yaad karo school days","😈 History 300 - Ab historian mode","😵 History 400 - Yeh UPSC level hai","☠️ History 500 - Agar yeh aaya toh respect++ 🔥"],
["🙂 Spiritual 100 - Sabha basics","😏 Spiritual 200 - Dhyan diya hota","😈 Spiritual 300 - Real satsangi test","😵 Spiritual 400 - Yeh deep knowledge hai","☠️ Spiritual 500 - Yeh aaya toh guru level 🔥"],
["🙂 Movies 100 - Easy popcorn level","😏 Movies 200 - IMDb yaad hai?","😈 Movies 300 - Cinephile zone","😵 Movies 400 - Sirf reels se nahi hoga","☠️ Movies 500 - Director level 🔥"],
["🙂 Geo 100 - News dekhte ho ya reels?","😏 Geo 200 - Thoda serious ho jao","😈 Geo 300 - Debate level question","😵 Geo 400 - Anchors bhi confuse ho jaate","☠️ Geo 500 - IAS mindset 🔥"]
];

/* ===== UNIQUE WRONG ROASTS ===== */
let wrongReplies=[
"😭 Itna close tha… dimaag ne dhoka diya","💀 Yeh toh aata tha… kya kar diya",
"😵 Confidence 100%, result 0%","😂 Guess maarne ka result",
"🥲 Bhagwan bhi facepalm kar rahe honge","😬 Teacher bhi shock ho jaata",
"😶 Bhai kya logic tha yeh","📉 Team ka level down","😑 Risky play fail play",
"💔 Knowledge ne aaj leave liya","😓 Itna easy bhi nahi tha kya",
"🤡 Public ke saamne beizzati","😆 Reel wala guess tha kya",
"😒 Overconfidence ka result","😵‍💫 Brain loading failed",
"😑 Confidence gaya","😂 Try toh kiya","😐 Intentional tha kya",
"😶‍🌫️ System crash moment","😓 Itna bhi tough nahi tha",
"😆 Meme ban gaya","😬 Team sorry bol de",
"😑 Risky nahi stupid","🤦 Facepalm moment",
"😅 Close but wrong","😓 Thoda aur sochta",
"😶 Kya chal raha tha dimaag mein",
"😆 Public laughing silently",
"😬 Try better next time","💀 RIP answer"
];

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
shuffle(wrongReplies);
let idx=0;
function getRoast(){
if(idx>=wrongReplies.length){shuffle(wrongReplies);idx=0;}
return wrongReplies[idx++];
}

/* ================= GAME ================= */

const board=document.getElementById("board");

function createBoard(){

categories.forEach(cat=>{
let d=document.createElement("div");
d.className="category";
d.innerText=cat;
board.appendChild(d);
});

for(let i=0;i<5;i++){
for(let j=0;j<6;j++){

let cell=document.createElement("div");
cell.className="cell";
cell.innerText=(i+1)*200;

cell.onclick=function(){
if(cell.classList.contains("used"))return;

document.getElementById("questionBox").style.display="block";
document.getElementById("reaction").innerText=reactions[j][i];
document.getElementById("question").innerText=questions[j][i];

let optDiv=document.getElementById("options");
optDiv.innerHTML="";

options[j][i].forEach((opt,index)=>{
let div=document.createElement("div");
div.className="option";
div.innerText=opt;

div.onclick=function(){

let all=document.querySelectorAll(".option");
all.forEach(o=>o.onclick=null);

if(index===correctAnswers[j][i]){
div.classList.add("correct");
}else{
div.classList.add("wrong");
all[correctAnswers[j][i]].classList.add("correct");
document.getElementById("reaction").innerText=getRoast();
}
};

optDiv.appendChild(div);
});

cell.classList.add("used");
};

board.appendChild(cell);
}
}
}

createBoard();

</script>

</body>
</html>
