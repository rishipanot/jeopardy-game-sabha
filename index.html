<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeopardy - Savage Mode</title>

<style>
body {
    font-family: Arial;
    background: #000814;
    color: white;
    text-align: center;
}

h1 { color: gold; }

.board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    width: 95%;
    margin: auto;
}

.category {
    background: #001d3d;
    padding: 10px;
    font-weight: bold;
}

.cell {
    background: #003566;
    padding: 20px;
    cursor: pointer;
}

.cell.used {
    background: #222;
}

#questionBox {
    margin-top: 20px;
    padding: 20px;
    background: #111;
    display: none;
}

#reaction {
    color: #ffcc00;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>🔥 Jeopardy - Savage Mode 🔥</h1>

<div class="board" id="board"></div>

<div id="questionBox">
    <h2 id="question"></h2>
    <p id="reaction"></p>
</div>

<script>

const categories = [
"GK", "Sports", "Indian History", 
"Spiritual", "Movies", "Geopolitics"
];

const questions = [

/* GK */
[
"Which country gifted the Statue of Liberty to the USA?",
"What is the capital of Australia?",
"Which gas do plants absorb?",
"Who painted the Mona Lisa?",
"What is the currency of Japan?"
],

/* Sports (Hard) */
[
"Who was the first cricketer to score a double century in ODIs?",
"Who has the best bowling figures in a Test innings?",
"Who scored the fastest T20I century?",
"Which country won the first Cricket World Cup (1975)?",
"Who scored 400 runs in a single Test innings?"
],

/* History */
[
"Who defeated Ibrahim Lodi?",
"Founder of Vijayanagara Empire?",
"Mentor of Chandragupta Maurya?",
"Which Mughal ruler banned music?",
"Who built Nalanda University?"
],

/* Spiritual (FROM PPT) */
[
"P. P. Prabodh Swamiji’s Diksha place?",
"P. P. Prabodh Swamiji’s Birthplace and Birthdate?",
"Which avatar was Bhagwan Ram?",
"“Bhakto Keval Brahm ni j Murti” & “Yuvako Maru Rahday Che” sutra was given by whom (respectively)?",
"Swamiji spent _ years with parents, _ years studying, _ years with Bapa and _ years with us?"
],

/* Movies */
[
"First Indian talkie film?",
"Which movie won most Oscars?",
"Who composed Interstellar music?",
"First Indian actor in Hollywood lead?",
"Highest grossing movie worldwide?"
],

/* Geopolitics */
[
"India's nuclear doctrine?",
"Which country is part of QUAD?",
"Full form of BRICS?",
"India shares longest border with?",
"Which nation is NOT in NATO?"
]

];

const reactions = [

[
"🙂 GK 100 - Aata hai bhai… yaad kar",
"😏 GK 200 - Bas zubaan pe hai",
"😈 GK 300 - Yaad aa raha hai…",
"😵 GK 400 - Itna close…",
"☠️ GK 500 - Legend banega tu 🔥"
],

[
"🙂 Sports 100 - Easy lag raha?",
"😏 Sports 200 - IPL se bahar aa",
"😈 Sports 300 - Real fan test",
"😵 Sports 400 - Tough hai boss",
"☠️ Sports 500 - Analyst level 🔥"
],

[
"🙂 History 100 - NCERT flashback",
"😏 History 200 - Yaad kar",
"😈 History 300 - UPSC zone",
"😵 History 400 - Rare hai",
"☠️ History 500 - Respect++ 🔥"
],

[
"🙂 Spiritual 100 - Sabha basics",
"😏 Spiritual 200 - Dhyan diya hota",
"😈 Spiritual 300 - Real test",
"😵 Spiritual 400 - Deep knowledge",
"☠️ Spiritual 500 - Guru level 🔥"
],

[
"🙂 Movies 100 - Easy",
"😏 Movies 200 - IMDb level",
"😈 Movies 300 - Cinephile",
"😵 Movies 400 - Hard",
"☠️ Movies 500 - Director level 🔥"
],

[
"🙂 Geo 100 - News dekhta hai?",
"😏 Geo 200 - Thoda serious",
"😈 Geo 300 - Debate level",
"😵 Geo 400 - Tough",
"☠️ Geo 500 - IAS level 🔥"
]

];

const board = document.getElementById("board");

function createBoard() {

    categories.forEach(cat => {
        let div = document.createElement("div");
        div.className = "category";
        div.innerText = cat;
        board.appendChild(div);
    });

    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 6; j++) {

            let cell = document.createElement("div");
            cell.className = "cell";
            cell.innerText = (i + 1) * 100;

            cell.onclick = function () {

                if (cell.classList.contains("used")) return;

                document.getElementById("questionBox").style.display = "block";
                document.getElementById("question").innerText = questions[j][i];
                document.getElementById("reaction").innerText = reactions[j][i];

                cell.classList.add("used");
            };

            board.appendChild(cell);
        }
    }
}

createBoard();

</script>

</body>
</html>
